name: Security Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: 'go.mod'

    # Blocking: a reachable vulnerability in module dependencies fails CI.
    - name: Run govulncheck
      run: |
        echo "Checking for vulnerabilities in dependencies..."
        go tool govulncheck ./...

    # Blocking: gosec runs as part of golangci-lint with the project's
    # curated exclusion policy (.golangci.yml gosec.excludes). Running it
    # through golangci-lint keeps a single source of truth for exclusions
    # instead of maintaining a parallel standalone gosec config.
    - name: Run gosec (via golangci-lint)
      run: |
        echo "Running security analysis..."
        go tool golangci-lint run --timeout=10m ./...

    - name: Summary
      run: echo "Security checks passed."
