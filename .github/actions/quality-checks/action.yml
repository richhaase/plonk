name: 'Quality Checks'
description: 'Run linting, formatting, and security checks'
inputs:
  run-linter:
    description: 'Run golangci-lint (default: true)'
    required: false
    default: 'true'
  run-formatter:
    description: 'Run goimports formatter (default: true)'
    required: false
    default: 'true'
  run-security:
    description: 'Run security checks (default: false)'
    required: false
    default: 'false'
  test-build:
    description: 'Test that the project builds (default: true)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Check formatting (read-only; fails on drift)
      if: ${{ inputs.run-formatter == 'true' }}
      run: |
        UNFORMATTED=$(gofmt -l -s .)
        if [ -n "$UNFORMATTED" ]; then
          echo "The following files are not gofmt-formatted:"
          echo "$UNFORMATTED"
          echo "Run 'gofmt -w -s .' locally and commit the result."
          exit 1
        fi
      shell: bash

    - name: Run linter
      if: ${{ inputs.run-linter == 'true' }}
      run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint run --timeout=10m
      shell: bash

    - name: Run security checks
      if: ${{ inputs.run-security == 'true' }}
      run: make security
      shell: bash

    - name: Test build
      if: ${{ inputs.test-build == 'true' }}
      run: make build
      shell: bash

    - name: Verify quality checks
      run: echo "✅ All quality checks completed"
      shell: bash
